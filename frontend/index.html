<html>
    <head>
        <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="chat-container">

        <div class="chat-header">
            <img src="logo.svg" alt="Logo" />
            <p>Mistral</p>
        </div>

        <div id="chatbox"></div>

        <div class="input-area">
            <input id="fileInput" type="file" accept=".pdf,.docx,.txt" hidden>
            <button id="uploadBtn" title="Učitaj dokument (PDF, DOCX, TXT)">📎</button>

            <input id="input" type="text" placeholder="Postavite pitanje ...">
            <button id="sendBtn">Pošalji</button>
        </div>

        <div class="chat-footer">
            <img src="logo-edih.png" alt="logo edih">
        </div>

        <script src="script.js"></script>
    </body>
</html>
